name: Deploy SOC Dashboard
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepare published site
        run: |
          rm -rf _site
          mkdir -p _site
          cp dashboard/index.html _site/index.html
          cp dashboard/admin.html _site/admin.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - id: deployment
        uses: actions/deploy-pages@v4
