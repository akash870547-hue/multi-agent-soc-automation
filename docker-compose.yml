services:
  soc-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - soc-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  soc-data: