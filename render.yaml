services:
  - type: web
    name: multi-agent-soc-api
    runtime: docker
    healthCheckPath: /ready
    plan: starter
    disk:
      name: soc-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SOC_DB_PATH
        value: /data/soc_automation.db
      - key: SOC_CORS_ORIGINS
        value: https://akash870547-hue.github.io
      - key: SOC_ENABLE_WEBSITE_MONITOR
        value: "true"
      - key: SOC_MONITOR_INTERVAL_SECONDS
        value: "300"
      - key: SOC_RATE_LIMIT
        value: "60"
      - key: SOC_RATE_WINDOW_SECONDS
        value: "60"
      - key: SOC_API_KEY
        sync: false
      - key: SOC_ANALYST_KEY
        sync: false
      - key: SOC_RESPONDER_KEY
        sync: false
      - key: SOC_ADMIN_KEY
        sync: false
